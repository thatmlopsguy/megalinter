---
descriptor_id: ARGOCD
descriptor_type: tooling_format
descriptor_flavors:
  - all_flavors # Applicable to CI in any language project
file_extensions:
  - ".yml"
  - ".yaml"
# Keep only the files OctoDoctor analyzes: Argo CD custom resources
# (Application, ApplicationSet, AppProject, cluster Secrets) and the Argo CD
# settings ConfigMaps / Secret
file_contains_regex:
  - 'argoproj\.io/'
  - 'name:\s*["'']?argocd-(cm|cmd-params-cm|rbac-cm|tls-certs-cm|ssh-known-hosts-cm|secret)["'']?\s*$'
linters:
  # OCTODOCTOR
  - class: OctodoctorLinter
    linter_name: octodoctor
    name: ARGOCD_OCTODOCTOR
    linter_text: |
      **OctoDoctor for Argo CD** is a static analysis tool by Octopus Deploy that checks your Argo CD manifests for misconfigurations, anti-patterns and risky settings in your GitOps setup, before they reach a cluster.

      **Key Features:**

      - **Argo CD aware**: Analyzes Applications, ApplicationSets, AppProjects, the Argo CD settings ConfigMaps (`argocd-cm`, `argocd-cmd-params-cm`, `argocd-rbac-cm`...), `argocd-secret` and cluster Secrets, and ignores every other Kubernetes manifest
      - **Security checks**: Detects dangerous sync policies (`prune` + `allowEmpty`), wildcard `sourceRepos` in AppProjects, anonymous access, parameter overrides and Image Updater setups that do not write back to Git
      - **Performance checks**: Flags low `requeueAfterSeconds`, missing `manifest-generate-paths` annotations, missing webhooks, zero sync timeouts and reconciliation settings that overload the repo server
      - **Repository-wide rules**: Evaluates the whole set of manifests together (number of ApplicationSets, cluster generators for multi-cluster setups...)
      - **Rich reports**: Generates HTML, JSON and YAML reports listing every failed rule with its affected files and documentation link

      **How MegaLinter runs it:**

      - MegaLinter copies the Argo CD manifests kept by its file filters (`EXCLUDED_DIRECTORIES`, `FILTER_REGEX_INCLUDE`, `FILTER_REGEX_EXCLUDE`, `.gitignore`...) in a temporary directory outside of the analyzed sources, then runs `octodoctor --directory` on it: OctoDoctor never writes in your repository
      - Repository-wide rules need every manifest, so when `VALIDATE_ALL_CODEBASE` is `false` the linter is triggered by updated Argo CD files, but still analyzes all the Argo CD files of the repository
      - The failed rules and their affected files are displayed in the linter log, and the OctoDoctor HTML, JSON and YAML reports are saved in the `octodoctor` folder of the MegaLinter reports folder
      - OctoDoctor has no configuration file and no inline suppression: use `ARGOCD_OCTODOCTOR_FILTER_REGEX_EXCLUDE` to exclude files from the analysis, or `ARGOCD_OCTODOCTOR_DISABLE_ERRORS: true` to make its findings non-blocking
    linter_url: https://octodoctor-argocd.readthedocs.io/
    linter_repo: https://github.com/OctopusDeploy/octodoctor-argocd
    linter_rules_url: https://octodoctor-argocd.readthedocs.io/en/latest/rules/
    linter_spdx_license: Apache-2.0
    linter_speed: 5
    linter_image_url: https://raw.githubusercontent.com/OctopusDeploy/octodoctor-argocd/main/docs/octodoctor-logo.png
    linter_icon_png_url: https://raw.githubusercontent.com/OctopusDeploy/octodoctor-argocd/main/docs/favicon.png
    test_folder: argocd
    cli_lint_mode: project
    supported_cli_lint_modes:
      - project
    help_command_return_code: 2
    cli_lint_errors_count: regex_number
    cli_lint_errors_regex: 'Analysis complete\. ([0-9]+) rule\(s\) failed'
    examples:
      - "octodoctor"
      - "octodoctor --directory /path/to/argocd/manifests"
      - "octodoctor --directory /path/to/argocd/manifests --limit 20"
    install:
      dockerfile:
        - |-
          # renovate: datasource=github-releases depName=OctopusDeploy/octodoctor-argocd extractVersion=^v(?<version>.+)$
          ARG ARGOCD_OCTODOCTOR_VERSION=0.3.0
        - |-
          FROM alpine:3.24 AS octodoctor
          ARG TARGETARCH
          ARG ARGOCD_OCTODOCTOR_VERSION
          RUN set -eu; mkdir -p /out/bin; \
              apk add --no-cache curl ca-certificates; \
              case "$TARGETARCH" in \
                amd64|arm64) ARCH="$TARGETARCH" ;; \
                *) echo "unsupported arch: $TARGETARCH" >&2; exit 1 ;; \
              esac; \
              ARCHIVE="octodoctor_${ARGOCD_OCTODOCTOR_VERSION}_linux_${ARCH}.tar.gz"; \
              RELEASE_URL="https://github.com/OctopusDeploy/octodoctor-argocd/releases/download/v${ARGOCD_OCTODOCTOR_VERSION}"; \
              cd /tmp; \
              curl --retry 5 --retry-delay 5 -fsSL -o "${ARCHIVE}" "${RELEASE_URL}/${ARCHIVE}"; \
              curl --retry 5 --retry-delay 5 -fsSL -o checksums.txt "${RELEASE_URL}/checksums.txt"; \
              grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -; \
              tar -xzf "${ARCHIVE}" -C /out/bin octodoctor; \
              rm "${ARCHIVE}" checksums.txt; \
              chmod +x /out/bin/octodoctor
        - COPY --link --from=octodoctor /out/bin/octodoctor /usr/bin/octodoctor
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
